name: Release Korean patch
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -X utf8 validate.py
      - run: python -X utf8 -m unittest discover -p test_patcher.py -v
      - run: python -X utf8 package.py
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/*.zip --verify-tag --title "Korean patch $env:GITHUB_REF_NAME" --notes-file COMPATIBILITY.md

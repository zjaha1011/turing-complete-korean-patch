name: Validate Korean patch
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -X utf8 validate.py
      - run: python -X utf8 -m unittest discover -p test_patcher.py -v
      - run: python -X utf8 package.py
      - uses: actions/upload-artifact@v7
        with:
          name: korean-patch
          path: dist/*.zip
